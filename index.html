<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Layout & Illustration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <!-- Left Side: Text -->
    <div class="hero-content">
      <h1>Crafting with Pure CSS ✨</h1>
      <p>
        A responsive hero section with advanced CSS grid, variables, 
        and pure CSS illustrations powered by smooth animations.
      </p>
      <button class="btn" id="cta-btn">Explore More</button>
    </div>

    <!-- Right Side: Illustration -->
    <div class="illustration">
      <div class="circle"></div>
      <div class="triangle"></div>
      <div class="square"></div>
      <div class="orbit"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
